version: '3.8'

services:
  # Servicio PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: spacex_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      # Persiste datos en volumen
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - etl-spacex

  # Servicio de la aplicación Streamlit
  app:
    build: .
    container_name: spacex_app
    environment:
      # Variables de conexión a BD
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SPACEX_BASE_URL: ${SPACEX_BASE_URL}
      SPACEX_ENDPOINTS: ${SPACEX_ENDPOINTS}
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Monta código local para desarrollo (hot reload)
      - .:/app
      - /app/__pycache__
    networks:
      - etl-spacex
    

# Volúmenes persistentes
volumes:
  postgres_data:
    driver: local

# Red personalizada
networks:
  etl-spacex:
    driver: bridge